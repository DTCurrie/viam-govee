version: "2"

run:
  timeout: 5m

linters:
  enable:
    - gocritic
    - misspell
    - revive
  settings:
    revive:
      rules:
        - name: blank-imports
        - name: exported
        - name: unreachable-code
        - name: unused-parameter

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/DTCurrie/viam-govee
